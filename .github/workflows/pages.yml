# Publishes website/ (privacy, terms, support) by copying it to the gh-pages branch on every push that changes it.
# GitHub Pages serves that branch at https://iliescub.github.io/tinyhabitsios/
# One-time setup: repository Settings › Pages › Build and deployment › Source: Deploy from a branch › gh-pages / (root).
name: Website
on:
  push:
    branches: [main, relaunch/v1]
    paths: ["website/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push website/ to gh-pages
        run: |
          git subtree split --prefix website -b gh-pages-new
          git push --force origin gh-pages-new:gh-pages
