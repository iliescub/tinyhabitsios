<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Fledge app icon, brand concept "First flight" (docs/BRAND.md). Layers for Icon Composer: #background, #bird, #wing.
       Geometry matches render-icon.swift (mark space centred at 549,470, scaled 1.06). -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A86FF"/>
      <stop offset="0.5" stop-color="#8DB6FF"/>
      <stop offset="1" stop-color="#FFC7A1"/>
    </linearGradient>
  </defs>
  <g id="background">
    <rect width="1024" height="1024" fill="url(#sky)"/>
  </g>
  <g transform="translate(512 512) scale(1.06) translate(-549 -470)">
    <g id="bird">
      <circle cx="548" cy="470" r="214" fill="#FFFFFF"/>
      <polygon points="356,404 256,436 356,468" fill="#FFB13D"/>
      <circle cx="430" cy="404" r="23" fill="#1B2240"/>
    </g>
    <g id="wing">
      <polyline points="478,522 558,598 810,300" fill="none" stroke="#FF5F45" stroke-width="64" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
